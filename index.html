<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product-card</title>
</head>

<body>
    <main class="main">
        <h1 class="title">Выбери свой продукт</h1>
        <div class="container">
            <div class="product_card card">
                <img src="assets/photo-1.png" alt="Увлажняющий мусс">
                <div class="product_header header" 
                <p class="label_text text">для нормальной кожи</p>
                    <h2 class="Product_name name">Увлажняющий мусс</h2>
                    <p class="product_description description">Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.</p>
                </div>
                <ul class="product_structure structure">Состав:
                    <li>активные натуральные комплексы</li>
                    <li>витамины С, А, РР, В И Е</li>
                    <li>солнцезащитные компоненты</li>
                </ul>
                <div class="product_price price">
                    <p>Цена:</p>
                    <p>2 750 ₽</p>
                </div>
            </div>
    </main>
</body>

</html>
